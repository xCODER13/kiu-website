name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:5000

  # Playwright E2E: haqiqiy backend (kiu-backend) + haqiqiy (vaqtinchalik) test
  # Mongo bilan to'liq foydalanuvchi oqimlarini sinaydi (login, admin CRUD,
  # ariza yuborish, Sorting Hat). backend-tests (backend-ci.yml) bilan bir xil
  # mongo:8.0 service pattern'i ishlatiladi. Rasm yuklash (Supabase) sinovi
  # SUPABASE_URL/SUPABASE_SERVICE_KEY sirlar mavjud bo'lgandagina ishlaydi —
  # aks holda avtomatik o'tkazib yuboriladi (hech qanday kalit hardcode qilinmagan).
  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo-test:
        image: mongo:8.0
        ports:
          - 27019:27017
        options: >-
          --tmpfs /data/db
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 5s

    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27019/kiu-e2e-test
      # Repo sirlarida mavjud bo'lsa, rasm yuklash sinovi ham ishga tushadi
      # (sinov bucket'iga ishora qilishi kerak — production kalit EMAS).
      SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci
        working-directory: kiu-backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - name: Upload Playwright hisobotini (muvaffaqiyatsizlikda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7