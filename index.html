    <meta name="color-scheme" content="light dark" />
    <script src="/theme-init.js"></script>

    <!-- SVG favicon (zamonaviy brauzerlar), PNG — SVG'ni qo'llamaydigan brauzerlar (Safari) va iOS uchun -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Qarshi Xalqaro Universiteti | KIU</title>

    <link rel="canonical" href="https://kiu-university.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kiu-university.vercel.app/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Shrift CSS'i render'ni bloklamaydi: preload shu yerda boshlanadi, <link rel="stylesheet"> ni /fonts-init.js qo'shadi.
         (Avval `onload="…"` inline handler edi — CSP `script-src` (inline'siz) bilan mos kelmaydi.) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    />
    <script src="/fonts-init.js" defer></script>
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" />
    </noscript>
  </head>
